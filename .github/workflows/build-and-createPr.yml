name: Build and Create a PR to Main

env:
  AZURE_WEBAPP_NAME: vctfantasy    # set this to the name of your Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10'                 # set this to the .NET Core version to use
  PATH_BUILD_SLN: 'src/VctFantasy.slnx'
  
on:
  push:
    branches: ["feature**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build --configuration Release ${{ env.PATH_BUILD_SLN }}

      - name: dotnet publish
        run: dotnet publish -c Release ${{ env.PATH_BUILD_SLN }} -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  create-pull-request:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        run: |
          gh pr create --title "Automated Pull Request" --body "This pull request was created by a GitHub Actions workflow." --base main --head ${{github.head_ref || github.ref_name}}
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
